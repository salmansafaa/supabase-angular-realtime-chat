<main>
  <div class="container">
    <h3 class="mb-3">Supa Chat 
      <button (click)="logOut()" class="btn btn-secondary" style="float: right;">Log out</button>
    </h3>
    
    <div class="card">
      <div class="col-12 col-lg-12 col-xl-12">
        <div class="chat-messages p-4">
          <div class="chat-message-left pb-4">
            <div class="flex-shrink-1 bg-light rounded py-2 px-3 ml-3">
              <div class="font-weight-bold mb-1">System</div>
              Welcome to the chat! Messages you send will appear in Supabase.
            </div>
          </div>
        </div>

        <form [formGroup]="chatForm" (ngSubmit)="onSubmit()">
          <div class="flex-grow-0 py-3 px-4 border-top">
            <div class="input-group">
              <input 
                formControlName="chat_message" 
                type="text" 
                class="form-control" 
                placeholder="Type your message">
              <button [disabled]="!chatForm.valid" class="btn btn-primary">Send</button>
            </div>
          </div>
        </form>
        </div>
    </div>
  </div>
</main>
